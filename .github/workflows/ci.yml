name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed application files
        run: npx eslint src/pages/AttorneySearch.tsx src/pages/JusticeResearchEngine.tsx src/pages/Library.tsx

      - name: Production build
        run: npm run build
